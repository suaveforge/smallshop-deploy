name: Check smallshop Pages HTTPS readiness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-health.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Show Pages certificate state without credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --max-time 18 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/suaveforge/smallshop-deploy/pages" \
            -o /tmp/smallshop-pages.json -w "PAGES_API_HTTP=%{http_code}\n"
          node -e '
          const d=require("/tmp/smallshop-pages.json");
          console.log("PAGES_CNAME="+(d.cname||"none"));
          console.log("PAGES_STATUS="+(d.status||"unknown"));
          console.log("PAGES_BUILD_TYPE="+(d.build_type||"unknown"));
          console.log("PAGES_HTML_URL="+(d.html_url||"none"));
          console.log("PAGES_CERT_STATE="+(d.https_certificate?.state||"unknown"));
          console.log("PAGES_CERT_DESCRIPTION="+(d.https_certificate?.description||"unknown"));
          console.log("PAGES_HTTPS_ENFORCED="+d.https_enforced);
          if(d.message)console.log("PAGES_API_ERROR="+d.message);
          '
          echo "PUBLIC_DNS_CNAME:"
          dig +short CNAME smallshop.suaveforge.com || true
          echo "PUBLIC_HTTP_STATUS:"
          curl -sS -L -o /dev/null --max-time 15 -w '%{http_code}\n' http://smallshop.suaveforge.com/ || true
          echo "PUBLIC_HTTPS_STATUS:"
          curl -sS -L -o /dev/null --max-time 15 -w '%{http_code}\n' https://smallshop.suaveforge.com/ || true
