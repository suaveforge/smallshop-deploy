name: Deploy smallshop manually (optional)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref in private suaveforge/smallshop"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: smallshop-server123-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, server123, suaveforge-org]
    timeout-minutes: 30
    env:
      SMALLSHOP_PORT: ${{ vars.SMALLSHOP_PORT || '18195' }}
      SMALLSHOP_RELEASE_TAG: smallshop:manual-${{ github.run_id }}
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
        with:
          path: deploy
          persist-credentials: false
      - name: Verify read-only access token and Docker
        env:
          SOURCE_TOKEN: ${{ secrets.SMALLSHOP_SOURCE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo 'Missing private source read token. Prefer automatic deploy in smallshop source CI.'; exit 1; }
          command -v docker
          docker info >/dev/null
          bash -n deploy/scripts/deploy-docker.sh
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: suaveforge/smallshop
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SMALLSHOP_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Build, deploy and health check isolated container
        shell: bash
        run: bash deploy/scripts/deploy-docker.sh source
