name: Validate deployment configuration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate public storefront JavaScript and route files
        run: |
          node --check assets/site.js
          node --check assets/map.js
          test -s assets/map.css
          grep -q 'data-smallshop-map' assets/site.js
          grep -q 'OpenStreetMap' assets/map.js
          test -s index.html
          test -s 404.html
          test -s join/index.html
          grep -q "case 'join'" assets/site.js
          test -s assets/site.css
          test -s assets/food-placeholder.svg
          node --check tests/geo-smoke.mjs
          grep -q 'directory-filters' assets/site.js
          test "$(cat CNAME)" = smallshop.suaveforge.com
          for route in regions stores records cart admin partner; do test -s "$route/index.html"; done
      - name: Validate Docker Compose
        run: docker compose -f compose.yaml config --quiet
      - name: Validate shell scripts
        run: bash -n scripts/check-health.sh scripts/deploy-docker.sh
