name: Validate deployment configuration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: smallshop-validate-server123
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Approved server123 deploy runners 01/02/03 only.
    runs-on: [self-hosted, linux, x64, server123, suaveforge-org]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated Docker toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          docker info >/dev/null
      - name: Check JS syntax, public routes and static assets in Node 22 Docker
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            node:22-bookworm-slim sh -eu -c '
              node --check assets/site.js
              node --check assets/map.js
              node --check tests/geo-smoke.mjs
              test -s index.html
              test -s 404.html
              test -s join/index.html
              test -s assets/site.css
              test -s assets/map.css
              test -s assets/food-placeholder.svg
              grep -q "data-smallshop-map" assets/site.js
              grep -q "directory-filters" assets/site.js
              grep -q "OpenStreetMap" assets/map.js
              test "$(cat CNAME)" = smallshop.suaveforge.com
              for route in regions stores records cart admin partner; do test -s "$route/index.html"; done
            '
      - name: Validate Docker Compose syntax without touching host containers
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            docker:27-cli docker compose -f compose.yaml config --quiet
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/check-health.sh scripts/deploy-docker.sh
          echo "SMALLSHOP_VALIDATE_SELFHOSTED=PASS runner=$RUNNER_NAME"
