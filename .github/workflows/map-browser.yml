name: Map browser QA (Chrome)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/map-browser.yml'
      - 'tests/geo-smoke.mjs'
      - 'assets/map.js'
      - 'assets/map.css'
      - 'assets/site.js'
      - 'assets/site.css'
      - 'assets/food-placeholder.svg'
      - 'join/**'
  workflow_dispatch:

concurrency:
  group: smallshop-chrome-server123
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chrome-map-smoke:
    # Approved server123 deploy runners 01/02/03 only.
    runs-on: [self-hosted, linux, x64, server123, suaveforge-org]
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker runtime without installing host packages
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          docker info >/dev/null
      - name: Wait for this exact source version to appear on public Pages
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum assets/site.js | awk '{print $1}')"
          temp_file="$(mktemp)"
          trap 'rm -f "$temp_file"' EXIT
          for attempt in $(seq 1 108); do
            if curl -fsSL --connect-timeout 8 --max-time 18 \
              -H 'Cache-Control: no-cache' \
              "https://smallshop.suaveforge.com/assets/site.js?rev=$GITHUB_SHA&try=$attempt" \
              -o "$temp_file"; then
              actual="$(sha256sum "$temp_file" | awk '{print $1}')"
              if [ "$expected" = "$actual" ]; then
                echo "SMALLSHOP_PAGES_REVISION=PASS sha=$GITHUB_SHA attempt=$attempt"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Public Pages has not deployed this source revision. Do not test stale content."
          exit 1
      - name: Run Chrome QA inside disposable Playwright Docker
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --shm-size=768m \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            mcr.microsoft.com/playwright:v1.56.1-noble bash -euc '
              command -v node
              node --check tests/geo-smoke.mjs
              chrome_binary="$(find /ms-playwright -type f \( -path "*/chrome-linux64/chrome" -o -path "*/chrome-linux/chrome" \) -print -quit)"
              test -n "$chrome_binary" && test -x "$chrome_binary" || {
                echo "Chromium executable missing from isolated browser image"
                exit 1
              }
              mkdir -p /tmp/smallshop-qa-bin
              ln -sf "$chrome_binary" /tmp/smallshop-qa-bin/google-chrome
              export PATH="/tmp/smallshop-qa-bin:$PATH"
              if ! fc-match :lang=ko | grep -qiE "Noto|Nanum|UnDotum|Baekmuk"; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fonts-noto-cjk
                fc-cache -f >/dev/null
              fi
              echo "SMALLSHOP_CHROME_ISOLATED=YES"
              node tests/geo-smoke.mjs
            '
      - name: Save browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallshop-map-browser-screenshots
          path: map-qa-artifacts/
          retention-days: 7
